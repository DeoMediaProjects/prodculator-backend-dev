<!doctype html>
<html>
  <body style="font-family: Arial, sans-serif; color: #111; line-height: 1.5;">
    <h2>{{ heading }}</h2>
    <p>{{ message }}</p>
    {% if details %}
    <table style="border-collapse: collapse; font-size: 13px; color: #333; margin-top: 8px;">
      {% for label, value in details.items() %}
      <tr>
        <td style="padding: 4px 12px 4px 0; color: #666;">{{ label }}</td>
        <td style="padding: 4px 0; font-weight: 700;">{{ value }}</td>
      </tr>
      {% endfor %}
    </table>
    {% endif %}
    <p style="color: #666; font-size: 13px; margin-top: 16px;">
      This is an automated Business Intelligence operations alert.
    </p>
  </body>
</html>
