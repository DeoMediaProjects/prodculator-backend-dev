name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libffi-dev libgdk-pixbuf-2.0-0
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff bandit pip-audit
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Static security scan (Bandit)
        run: bandit -r app -lll -q
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
      - name: Tests (pytest)
        run: pytest -q

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    # Gate: never ship a red build. Deploy only runs if tests pass.
    needs: test

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            cd ${{ secrets.APP_DIR }}

            echo "Pulling latest code..."
            git pull origin main

            echo "Installing dependencies..."
            venv/bin/pip install -r requirements.txt --quiet

            echo "Running database migrations..."
            venv/bin/alembic upgrade head

            echo "Restarting service..."
            sudo systemctl restart prodculator.service

            echo "Waiting for readiness..."
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error http://127.0.0.1:8000/api/health/ready > /dev/null; then
                echo "Service is ready."
                exit 0
              fi
              sleep 5
            done

            echo "Service did not become ready after 60 seconds."
            sudo journalctl -u prodculator.service -n 100 --no-pager
            exit 1

            echo "Deploy complete."
